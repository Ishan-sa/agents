[project]
name = "reply-handler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gspread>=6.1",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "ulid-py>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reply_handler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[project.scripts]
reply-handler = "reply_handler.cli:main"
