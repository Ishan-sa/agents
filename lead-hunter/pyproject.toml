[project]
name = "lead-hunter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=1.8",
    "gspread>=6.1",
    "google-auth>=2.30",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "tenacity>=8.5",
    "ulid-py>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",  # mock httpx
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[project.scripts]
lead-hunter = "lead_hunter.cli:main"
